<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Destiny 2 Lore Knowledge Base">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050a14"/>
      <stop offset="50%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#0f1424"/>
    </linearGradient>
    <radialGradient id="goldglow" cx="0.85" cy="0.5" r="0.4">
      <stop offset="0%" stop-color="#c8a951" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="textblur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.85">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="accentfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8a951" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c8a951" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leftfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="radiolaria" cx="0.82" cy="0.5" r="0.18">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="venustint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.07"/>
      <stop offset="25%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentcyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8a951" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a5f3fc" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#space)"/>
  <rect width="1200" height="320" fill="url(#goldglow)"/>

  <!-- Subtle grid lines (UI feel) -->
  <g stroke="#c8a951" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
  </g>


  <!-- Title block (left) -->
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', sans-serif" filter="url(#textblur)" opacity="0.7">
    <text x="60" y="96" font-size="16" font-weight="500" fill="#000000" letter-spacing="8">[ ISHTAR  ·  VEX  ·  VENUS ]</text>
    <text x="60" y="156" font-size="64" font-weight="700" fill="#000000" letter-spacing="2">DESTINY 2 LORE</text>
    <text x="60" y="192" font-size="18" font-weight="500" fill="#000000" letter-spacing="5">KNOWLEDGE BASE</text>
    <text x="62" y="226" font-size="13" font-weight="400" fill="#000000" letter-spacing="4">YOUR GHOST IS NOT AN AGENT.</text>
  </g>
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', sans-serif">
    <text x="60" y="96" font-size="16" font-weight="500" fill="#c8a951" letter-spacing="8">[ ISHTAR  ·  VEX  ·  VENUS ]</text>
    <text x="60" y="156" font-size="64" font-weight="700" fill="#f5f5f5" letter-spacing="2">DESTINY 2 LORE</text>
    <text x="60" y="192" font-size="18" font-weight="500" fill="#e5d5a0" letter-spacing="5">KNOWLEDGE BASE</text>
    <text x="62" y="226" font-size="13" font-weight="400" fill="#8a8a8a" letter-spacing="4">YOUR GHOST IS NOT AN <tspan fill="#c8a951" dx="3">AGENT.</tspan></text>
  </g>

  <!-- Accent line -->
  <rect x="60" y="168.25" width="400" height="1.5" fill="url(#accentcyan)"/>

  <!-- Data readout (right edge) -->
  <text transform="translate(1184, 243) rotate(-90)" font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', sans-serif" font-size="8" font-weight="500" letter-spacing="2" fill="#c8a951" opacity="0.25">VEX  ·  04.821  ·  09.440  ·  VENUS</text>

  <!-- Corner brackets -->
  <g fill="none" stroke-width="1.5" opacity="0.5">
    <path d="M 24 46 L 38 32 L 24 18" stroke="#c8a951"/>
    <path d="M 40 46 L 54 32 L 40 18" stroke="#c8a951"/>
    <path d="M 1176 274 L 1162 288 L 1176 302" stroke="#a5f3fc"/>
    <path d="M 1160 274 L 1146 288 L 1160 302" stroke="#a5f3fc"/>
  </g>

  <rect width="360" height="320" fill="url(#leftfade)"/>
  <!-- Traveler silhouette (right) -->
  <g transform="translate(980,160)" opacity="0.12">
    <circle cx="0" cy="0" r="90" fill="#c8a951"/>
    <circle cx="0" cy="0" r="70" fill="#0a1020"/>
  </g>

  <!-- Vex motif (recursive, asymmetric) -->
  <g transform="translate(980,160)" fill="none" stroke="#c8a951" opacity="0.32">
    <polygon points="0,-70 60.6,-35 60.6,35 0,70 -60.6,35 -60.6,-35" stroke-width="0.9"/>
    <g transform="translate(18,-12) scale(0.62)" opacity="0.85">
      <polygon points="0,-70 60.6,-35 60.6,35 0,70 -60.6,35 -60.6,-35" stroke-width="1.2"/>
    </g>
    <g transform="translate(-24,14) scale(0.38)" opacity="0.7">
      <polygon points="0,-70 60.6,-35 60.6,35 0,70 -60.6,35 -60.6,-35" stroke-width="1.4"/>
    </g>
  </g>

  <!-- Traveler reticle -->
  <g fill="none" stroke="#c8a951">
    <circle cx="980" cy="160" r="100" stroke-width="1" opacity="0.4"/>
    <circle cx="980" cy="160" r="114" stroke-width="0.7" opacity="0.25"/>
  </g>
  <circle cx="866" cy="160" r="2" fill="#4ade80" opacity="0.6"/>
  <circle cx="1094" cy="160" r="2" fill="#4ade80" opacity="0.6"/>

  <rect width="1200" height="320" fill="url(#radiolaria)"/>
  <rect width="360" height="320" fill="url(#venustint)"/>
  <!-- Oracle eye (Vex) -->
  <g transform="translate(900,235)" fill="none" stroke="#a5f3fc" opacity="0.16">
    <circle cx="0" cy="0" r="22" stroke-width="0.9"/>
    <circle cx="0" cy="0" r="14" stroke-width="0.7"/>
    <circle cx="0" cy="0" r="6" stroke-width="0.6"/>
    <line x1="0" y1="-22" x2="0" y2="22" stroke-width="0.6"/>
  </g>

  <!-- Decimal grid (right half, Vex precision) -->
  <g stroke="#a5f3fc" stroke-width="0.4" opacity="0.03">
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="680" y1="0" x2="680" y2="320"/>
    <line x1="720" y1="0" x2="720" y2="320"/>
    <line x1="760" y1="0" x2="760" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="840" y1="0" x2="840" y2="320"/>
    <line x1="880" y1="0" x2="880" y2="320"/>
    <line x1="920" y1="0" x2="920" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
    <line x1="1040" y1="0" x2="1040" y2="320"/>
    <line x1="1080" y1="0" x2="1080" y2="320"/>
    <line x1="1120" y1="0" x2="1120" y2="320"/>
    <line x1="1160" y1="0" x2="1160" y2="320"/>
    <line x1="1200" y1="0" x2="1200" y2="320"/>
    <line x1="600" y1="0" x2="1200" y2="0"/>
    <line x1="600" y1="40" x2="1200" y2="40"/>
    <line x1="600" y1="80" x2="1200" y2="80"/>
    <line x1="600" y1="120" x2="1200" y2="120"/>
    <line x1="600" y1="160" x2="1200" y2="160"/>
    <line x1="600" y1="200" x2="1200" y2="200"/>
    <line x1="600" y1="240" x2="1200" y2="240"/>
    <line x1="600" y1="280" x2="1200" y2="280"/>
    <line x1="600" y1="320" x2="1200" y2="320"/>
  </g>

  <rect width="1200" height="320" fill="url(#vig)" pointer-events="none"/>
</svg>