<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Destiny Agent Grimoire - Your Ghost Is Not An Agent">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050a14"/>
      <stop offset="50%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#0f1424"/>
    </linearGradient>
    <radialGradient id="goldglow" cx="0.85" cy="0.5" r="0.4">
      <stop offset="0%" stop-color="#c8a951" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="radiolaria" cx="0.82" cy="0.5" r="0.22">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="venustint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.07"/>
      <stop offset="25%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentcyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8a951" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a5f3fc" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="textblur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.85">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#space)"/>
  <rect width="1280" height="640" fill="url(#goldglow)"/>
  <rect width="1280" height="640" fill="url(#radiolaria)"/>
  <rect width="480" height="640" fill="url(#venustint)"/>

  <!-- Subtle grid lines -->
  <g stroke="#c8a951" stroke-width="0.6" opacity="0.08">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Decimal grid (right half) -->
  <g stroke="#a5f3fc" stroke-width="0.5" opacity="0.04">
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="704" y1="0" x2="704" y2="640"/>
    <line x1="768" y1="0" x2="768" y2="640"/>
    <line x1="832" y1="0" x2="832" y2="640"/>
    <line x1="896" y1="0" x2="896" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1024" y1="0" x2="1024" y2="640"/>
    <line x1="1088" y1="0" x2="1088" y2="640"/>
    <line x1="1152" y1="0" x2="1152" y2="640"/>
    <line x1="1216" y1="0" x2="1216" y2="640"/>
    <line x1="1280" y1="0" x2="1280" y2="640"/>
    <line x1="640" y1="0" x2="1280" y2="0"/>
    <line x1="640" y1="64" x2="1280" y2="64"/>
    <line x1="640" y1="128" x2="1280" y2="128"/>
    <line x1="640" y1="192" x2="1280" y2="192"/>
    <line x1="640" y1="256" x2="1280" y2="256"/>
    <line x1="640" y1="320" x2="1280" y2="320"/>
    <line x1="640" y1="384" x2="1280" y2="384"/>
    <line x1="640" y1="448" x2="1280" y2="448"/>
    <line x1="640" y1="512" x2="1280" y2="512"/>
    <line x1="640" y1="576" x2="1280" y2="576"/>
    <line x1="640" y1="640" x2="1280" y2="640"/>
  </g>

  <!-- Traveler silhouette (right) -->
  <g transform="translate(1000,320)" opacity="0.14">
    <circle cx="0" cy="0" r="150" fill="#c8a951"/>
    <circle cx="0" cy="0" r="118" fill="#0a1020"/>
  </g>

  <!-- Vex motif (recursive, asymmetric) -->
  <g transform="translate(1000,320)" fill="none" stroke="#c8a951" opacity="0.3">
    <polygon points="0,-118 102,-59 102,59 0,118 -102,59 -102,-59" stroke-width="1.4"/>
    <g transform="translate(30,-20) scale(0.62)" opacity="0.85">
      <polygon points="0,-118 102,-59 102,59 0,118 -102,59 -102,-59" stroke-width="1.6"/>
    </g>
    <g transform="translate(-40,24) scale(0.38)" opacity="0.7">
      <polygon points="0,-118 102,-59 102,59 0,118 -102,59 -102,-59" stroke-width="1.8"/>
    </g>
  </g>

  <!-- Traveler reticle -->
  <g fill="none" stroke="#c8a951">
    <circle cx="1000" cy="320" r="170" stroke-width="1.2" opacity="0.35"/>
    <circle cx="1000" cy="320" r="195" stroke-width="0.8" opacity="0.2"/>
  </g>
  <circle cx="830" cy="320" r="3" fill="#4ade80" opacity="0.6"/>
  <circle cx="1170" cy="320" r="3" fill="#4ade80" opacity="0.6"/>

  <!-- Oracle eye -->
  <g transform="translate(860,420)" fill="none" stroke="#a5f3fc" opacity="0.18">
    <circle cx="0" cy="0" r="36" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="22" stroke-width="0.9"/>
    <circle cx="0" cy="0" r="9" stroke-width="0.8"/>
    <line x1="0" y1="-36" x2="0" y2="36" stroke-width="0.8"/>
  </g>

  <!-- Title block (left) -->
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', sans-serif" filter="url(#textblur)" opacity="0.7">
    <text x="72" y="180" font-size="24" font-weight="500" fill="#000000" letter-spacing="12">[ ISHTAR  ·  VEX  ·  VENUS ]</text>
    <text x="72" y="300" font-size="96" font-weight="700" fill="#000000" letter-spacing="3">DESTINY 2 LORE</text>
    <text x="72" y="370" font-size="28" font-weight="500" fill="#000000" letter-spacing="6">KNOWLEDGE BASE</text>
    <text x="72" y="440" font-size="20" font-weight="400" fill="#000000" letter-spacing="6">YOUR GHOST IS NOT AN AGENT.</text>
  </g>
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', sans-serif">
    <text x="72" y="180" font-size="24" font-weight="500" fill="#c8a951" letter-spacing="12">[ ISHTAR  ·  VEX  ·  VENUS ]</text>
    <text x="72" y="300" font-size="96" font-weight="700" fill="#f5f5f5" letter-spacing="3">DESTINY 2 LORE</text>
    <text x="72" y="370" font-size="28" font-weight="500" fill="#e5d5a0" letter-spacing="6">KNOWLEDGE BASE</text>
    <text x="72" y="440" font-size="20" font-weight="400" fill="#8a8a8a" letter-spacing="6">YOUR GHOST IS NOT AN <tspan fill="#c8a951" dx="4">AGENT.</tspan></text>
  </g>

  <!-- Accent line -->
  <rect x="72" y="316" width="600" height="2" fill="url(#accentcyan)"/>

  <!-- Corner chevrons -->
  <g fill="none" stroke-width="2" opacity="0.5">
    <path d="M 36 70 L 54 52 L 36 34" stroke="#c8a951"/>
    <path d="M 56 70 L 74 52 L 56 34" stroke="#c8a951"/>
    <path d="M 1244 570 L 1226 588 L 1244 606" stroke="#a5f3fc"/>
    <path d="M 1224 570 L 1206 588 L 1224 606" stroke="#a5f3fc"/>
  </g>

  <!-- Data readout (right edge) -->
  <text transform="translate(1260, 420) rotate(-90)" font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', sans-serif" font-size="12" font-weight="500" letter-spacing="3" fill="#c8a951" opacity="0.3">VEX  ·  04.821  ·  09.440  ·  VENUS</text>

  <rect width="1280" height="640" fill="url(#vig)" pointer-events="none"/>
</svg>
